name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f src/App.js
          test -f public/index.html

      - name: Run tests
        run: bash tests/project-structure.sh