
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
